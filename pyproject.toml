[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kh"
version = "0.1.0"
description = "Nghiên cứu định lượng Binance USDT-M Futures (chỉ nghiên cứu/backtest, không giao dịch thật)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "pyarrow>=14", "scipy>=1.11", "scikit-learn>=1.3",
  "numba>=0.58", "lightgbm>=4.0", "matplotlib>=3.7", "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
